name: Build

on:
  pull_request:
    paths-ignore:
     - 'README.md'
    branches: 
      - main
  push:
    paths-ignore:
     - 'README.md'
    branches: 
      - main

jobs:
  build:
    
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node-version: [22.x, 23.x]

    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@1d99fcaa2f7c1000af5f2a9194017d073d0d1035 # v4.2.0
      with:
        node-version: ${{ matrix.node-version }}
    - run: npm install
    - run: npm run test
      env:
        CI: true
